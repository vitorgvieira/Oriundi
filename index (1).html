<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giro — comprador ↔ loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F6F6F7;
    --surface:#FFFFFF;
    --surface-alt:#F0F0F1;
    --ink:#1C1C1E;
    --ink-soft:#67676B;
    --ink-faint:#9C9CA0;
    --red:#F40000;
    --red-dark:#C40000;
    --red-soft:#FDE7E7;
    --green:#008F3D;
    --green-dark:#00702F;
    --green-soft:#DFF3E6;
    --amber:#C9700A;
    --amber-soft:#FBEAD2;
    --line:#E7E7E9;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --radius:14px;
    /* legacy aliases kept so existing component styles keep working */
    --primary:var(--red);
    --primary-dark:var(--red-dark);
    --primary-soft:var(--red-soft);
    --alert:var(--red);
    --alert-soft:var(--red-soft);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;padding-bottom:64px;}
  @media(min-width:900px){
    #app{max-width:1080px;}
    main{padding:20px 24px;}
    header.top{padding:16px 24px 0 24px;}
    .db-bar{padding:9px 24px;}
    .card-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .card{margin-bottom:0;}
    .add-bar .btn-block{width:auto;min-width:260px;}
  }
  @media(min-width:1280px){
    .card-list{grid-template-columns:repeat(3,minmax(0,1fr));}
  }

  /* Header */
  header.top{
    position:sticky;top:0;z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:14px 16px 0 16px;
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .brand-lockup{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-logo{height:34px;width:auto;flex-shrink:0;}
  .brand-divider{width:1px;height:26px;background:var(--line);flex-shrink:0;}
  .wordmark{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .wordmark .name{
    font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.005em;
    color:var(--ink);line-height:1.1;
  }
  .wordmark .tagline{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.03em;text-transform:uppercase;}
  .role-toggle{display:inline-flex;background:var(--surface-alt);border-radius:999px;padding:3px;flex-shrink:0;}
  .role-toggle button{
    border:none;background:transparent;padding:6px 11px;border-radius:999px;
    font-family:var(--font-body);font-weight:600;font-size:11.5px;color:var(--ink-soft);
    cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;
  }
  .role-toggle button.active{background:var(--red);color:#fff;}

  .tabs{display:flex;gap:18px;overflow-x:auto;}
  .tab-btn{
    padding:10px 2px 12px 2px;background:none;border:none;border-bottom:2.5px solid transparent;
    font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-soft);
    cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;
  }
  .tab-btn.active{color:var(--red);border-bottom-color:var(--red);}
  .tab-count{
    font-family:var(--font-mono);font-size:10.5px;font-weight:600;background:var(--surface-alt);
    color:var(--ink-soft);padding:1px 7px;border-radius:999px;
  }
  .tab-btn.active .tab-count{background:var(--red-soft);color:var(--red-dark);}

  .db-bar{padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:4px 16px;}
  .db-link{
    background:none;border:none;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);
    cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px;
  }
  .db-link strong{color:var(--primary-dark);}
  .import-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px;}
  .import-table th{text-align:left;color:var(--ink-faint);font-weight:600;padding:4px 6px 4px 0;border-bottom:1px solid var(--line);}
  .import-table td{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);font-family:var(--font-mono);}

  /* Notices */
  .notice{
    margin:14px 16px 0 16px;padding:10px 12px;border-radius:8px;
    font-size:12.5px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;
  }
  .notice-local{background:var(--amber-soft);color:#7A4E0A;}
  .notice-urgent{background:var(--alert-soft);color:#7C2717;font-weight:600;}
  .notice button.close{background:none;border:none;color:inherit;opacity:.6;cursor:pointer;font-size:14px;margin-left:auto;padding:0;line-height:1;}

  /* Content */
  main{padding:16px;}
  .section-sub{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;
  }
  .filter-chips{display:flex;gap:6px;}
  .chip{
    font-family:var(--font-mono);font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;
  }
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .btn{
    font-family:var(--font-body);font-weight:700;font-size:13px;border-radius:10px;border:none;
    padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    letter-spacing:.01em;transition:background .15s,opacity .15s;
  }
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{opacity:.9;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-green:hover{background:var(--green-dark);}
  .btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-ghost{background:none;color:var(--ink-soft);padding:8px 10px;}
  .btn-ghost:hover{color:var(--red);}
  .btn-sm{font-size:12px;padding:7px 12px;}
  .btn-block{width:100%;justify-content:center;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .add-bar{margin-bottom:16px;}

  /* Cards */
  .card{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-left:4px solid var(--card-accent, var(--line));border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
    box-shadow:0 1px 2px rgba(20,20,22,.03), 0 4px 14px rgba(20,20,22,.035);
  }
  .card-top{display:flex;gap:12px;}
  .thumb{
    width:56px;height:56px;border-radius:11px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--line);background:var(--surface-alt);
  }
  .thumb-placeholder{
    width:56px;height:56px;border-radius:11px;flex-shrink:0;background:var(--surface-alt);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
    border:1px solid var(--line);
  }
  .card-info{flex:1;min-width:0;}
  .card-name{font-weight:700;font-size:14.5px;margin:0 0 2px 0;line-height:1.3;}
  .card-barcode{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);}
  .card-obs{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .card-meta{font-size:11.5px;color:var(--ink-faint);margin-top:8px;font-family:var(--font-mono);}
  .card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .proof-row{display:flex;gap:8px;margin-top:10px;}
  .proof-thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1px solid var(--line);}

  .tag{
    display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;
    font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;
    text-transform:uppercase;flex-shrink:0;
  }
  .tag-neutral{background:var(--surface-alt);color:var(--ink-soft);}
  .tag-primary{background:var(--green-soft);color:var(--green-dark);}
  .tag-amber{background:var(--amber-soft);color:#7A4E0A;}
  .tag-alert{background:var(--red-soft);color:var(--red-dark);}

  .empty{
    text-align:center;padding:44px 20px;color:var(--ink-soft);
  }
  .empty .big{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--ink);margin-bottom:6px;}
  .empty p{font-size:13px;line-height:1.6;max-width:320px;margin:0 auto;}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,24,20,.5);display:none;
    align-items:flex-end;justify-content:center;z-index:100;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:18px 18px 26px 18px;
  }
  @media(min-width:560px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:14px;}
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h3{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;}
  .icon-btn{background:none;border:none;font-size:18px;color:var(--ink-soft);cursor:pointer;padding:4px;line-height:1;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em;}
  .field .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;line-height:1.4;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field textarea{
    width:100%;font-family:var(--font-body);font-size:14px;padding:10px 11px;border-radius:8px;
    border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
  .field textarea{resize:vertical;min-height:64px;font-family:var(--font-body);}
  .barcode-row{display:flex;gap:8px;}
  .barcode-row input{font-family:var(--font-mono);}
  .scan-btn{
    flex-shrink:0;width:42px;height:42px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .lookup-status{font-size:12px;color:var(--ink-soft);margin-top:8px;display:flex;align-items:center;gap:7px;}
  .lookup-box{
    display:flex;gap:10px;align-items:center;background:var(--surface-alt);border-radius:8px;
    padding:8px;margin-top:8px;
  }
  .photo-input-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .photo-input-row .thumb,.photo-input-row .thumb-placeholder{width:48px;height:48px;}
  .file-label{
    font-size:12px;font-weight:600;color:var(--primary-dark);background:var(--primary-soft);
    padding:8px 12px;border-radius:7px;cursor:pointer;
  }
  .file-label input{display:none;}
  .warn-box{
    background:var(--alert-soft);color:#7C2717;font-size:12px;padding:9px 10px;border-radius:7px;
    margin-top:6px;line-height:1.5;
  }
  .checkbox-row{display:flex;align-items:flex-start;gap:8px;margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
  .checkbox-row input{margin-top:2px;}
  .context-card{
    background:var(--surface-alt);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:var(--ink-soft);
  }
  .context-card strong{color:var(--ink);}
  #scanner-box{border-radius:8px;overflow:hidden;}

  /* Auth / login */
  .auth-screen{
    position:fixed;inset:0;background:var(--bg);display:none;
    align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  .auth-screen.open{display:flex;}
  .auth-card{
    background:var(--surface);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;
    box-shadow:0 4px 24px rgba(20,20,22,.08);
  }
  .auth-logo{display:flex;justify-content:center;margin-bottom:18px;}
  .auth-logo img{height:40px;}
  .auth-title{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:center;margin-bottom:4px;}
  .auth-sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:20px;line-height:1.5;}
  .auth-error{background:var(--red-soft);color:var(--red-dark);font-size:12.5px;padding:8px 10px;border-radius:7px;margin-bottom:12px;}
  .spinner{
    width:32px;height:32px;border-radius:50%;margin:8px auto 0 auto;
    border:3px solid var(--surface-alt);border-top-color:var(--red);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .pin-input{letter-spacing:.4em;text-align:center;font-family:var(--font-mono);font-size:18px;}

  .user-badge{
    display:flex;align-items:center;gap:8px;background:var(--surface-alt);border-radius:999px;
    padding:5px 6px 5px 12px;flex-shrink:0;
  }
  .user-badge .who{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .user-badge .who span{display:block;font-weight:400;font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);text-transform:uppercase;}
  .user-badge button{
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    font-size:11px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .user-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);
  }
  .user-row:last-child{border-bottom:none;}
  .user-row .u-name{font-weight:600;font-size:13.5px;}
  .user-row .u-role{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;}
  .user-row .u-actions{display:flex;gap:6px;}

  footer.foot{
    text-align:center;padding:20px 16px 0 16px;font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);
  }
</style>
</head>

  /* ---------- backend: Google Sheets via Apps Script ---------- */
  var SHEETS_API_URL = '';
  var apiLoading = false;
  var apiOk = true;
  var apiError = '';
  var syncError = '';

  function loadApiUrl(){
    try{
      var v = localStorage.getItem('giro-api-url');
      if(v) SHEETS_API_URL = v;
    }catch(e){ /* localStorage indisponível neste contexto (ex.: pré-visualização) */ }
  }
  function saveApiUrl(url){
    SHEETS_API_URL = url;
    try{ localStorage.setItem('giro-api-url', url); }catch(e){}
  }
  function clearApiUrl(){
    SHEETS_API_URL = '';
    try{ localStorage.removeItem('giro-api-url'); }catch(e){}
  }

  function apiGet(action){
    var sep = SHEETS_API_URL.indexOf('?') === -1 ? '?' : '&';
    return fetch(SHEETS_API_URL + sep + 'action=' + encodeURIComponent(action)).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data){
      if(data && data.ok === false) throw new Error(data.error || 'Erro na planilha');
      return data;
    });
  }
  function apiPost(action, data){
    return fetch(SHEETS_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:action, data:data })
    }).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(out){
      if(out && out.ok === false) throw new Error(out.error || 'Erro na planilha');
      return out;
    });
  }
  function persistAndSync(promise){
    promise.then(function(){
      if(syncError){ syncError=''; renderNotices(); }
    }).catch(function(){
      syncError = 'Não foi possível sincronizar com a planilha agora. Suas alterações ficaram salvas só neste dispositivo até a conexão voltar — evite fechar a aba.';
      renderNotices();
    });
  }

  function persistExpo(){ persistAndSync(apiPost('saveItensExpo', itemsExpo)); }
  function persistVal(){ persistAndSync(apiPost('saveItensVal', itemsVal)); }
  function persistPlaca(){ persistAndSync(apiPost('saveItensPlaca', itemsPlaca)); }
  function persistUsers(){ persistAndSync(apiPost('saveUsuarios', users)); }
  function productDBToArray(){
    return Object.keys(productDB).map(function(bc){
      var p = productDB[bc] || {};
      return { barcode:bc, descricao:p.descricao||'', codigoInterno:p.codigoInterno||'', foto:p.foto||'' };
    });
  }
  function persistDB(){
    return apiPost('saveProdutos', productDBToArray());
  }

  function loadAll(){
    return apiGet('getAll').then(function(all){
      itemsExpo = all.itensExpo || [];
      itemsVal = all.itensVal || [];
      itemsPlaca = all.itensPlaca || [];
      users = all.usuarios || [];
      return apiGet('getProdutos');
    }).then(function(produtosArr){
      productDB = {};
      (produtosArr || []).forEach(function(p){
        if(!p || !p.barcode) return;
        var rec = {};
        if(p.descricao) rec.descricao = p.descricao;
        if(p.codigoInterno) rec.codigoInterno = p.codigoInterno;
        if(p.foto) rec.foto = p.foto;
        productDB[String(p.barcode)] = rec;
      });
      apiOk = true; apiError = '';
    }).catch(function(err){
      apiOk = false;
      apiError = String((err && err.message) || err);
    });
  }

  /* ---------- product lookup (best effort, public database) ---------- */
  function fetchProductInfo(barcode){
    if(!barcode || !window.fetch) return Promise.resolve(null);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var t = ctrl ? setTimeout(function(){ ctrl.abort(); }, 6000) : null;
    return fetch('https://world.openfoodfacts.org/api/v0/product/' + encodeURIComponent(barcode) + '.json',
      ctrl ? {signal:ctrl.signal} : {}
    ).then(function(res){
      if(t) clearTimeout(t);
      if(!res.ok) return null;
      return res.json();
    }).then(function(data){
      if(!data || data.status !== 1 || !data.product) return null;
      var p = data.product;
      var nome = p.product_name_pt || p.product_name || '';
      var foto = p.image_front_small_url || p.image_front_url || p.image_url || null;
      if(!nome && !foto) return null;
      return { nome:nome, foto:foto };
    }).catch(function(){ if(t) clearTimeout(t); return null; });
  }

  /* ---------- base de produtos interna (planilha do comprador) ---------- */
  var HEADER_SYNONYMS = {
    barcode: ['codigobarras','codigodebarras','codbarras','codbarra','ean','ean13','ean8','gtin','barcode','codigoean'],
    interno: ['codigointerno','codinterno','sku','codigoproduto','codproduto','codigosku','codigointernoproduto','codigodoproduto'],
    descricao: ['descricao','descricaoproduto','nome','nomeproduto','nomedoproduto','produto','desc'],
    foto: ['foto','imagem','fotourl','imagemurl','urlfoto','urlimagem','photo','image','urlimagemproduto']
  };
  function normalizeHeader(h){
    return String(h==null?'':h).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  }
  function matchHeader(rawHeader){
    var norm = normalizeHeader(rawHeader);
    for(var key in HEADER_SYNONYMS){
      if(HEADER_SYNONYMS[key].indexOf(norm) !== -1) return key;
    }
    return null;
  }
  function mapRowsToProducts(rows){
    var map = {}, count = 0;
    if(!rows || !rows.length) return {map:map, count:0};
    var headerKeys = Object.keys(rows[0]);
    var fieldFor = {};
    headerKeys.forEach(function(h){
      var f = matchHeader(h);
      if(f && !fieldFor[f]) fieldFor[f] = h;
    });
    if(!fieldFor.barcode) return {map:map, count:0};
    rows.forEach(function(row){
      var bc = String(row[fieldFor.barcode]==null?'':row[fieldFor.barcode]).trim().replace(/\s+/g,'');
      if(!bc) return;
      map[bc] = {
        codigoInterno: fieldFor.interno ? String(row[fieldFor.interno]==null?'':row[fieldFor.interno]).trim() : '',
        descricao: fieldFor.descricao ? String(row[fieldFor.descricao]==null?'':row[fieldFor.descricao]).trim() : '',
        foto: fieldFor.foto ? String(row[fieldFor.foto]==null?'':row[fieldFor.foto]).trim() : ''
      };
      count++;
    });
    return {map:map, count:count};
  }
  function parseSpreadsheetFile(file){
    return new Promise(function(resolve,reject){
      if(typeof XLSX === 'undefined'){ reject(new Error('XLSX indisponível')); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        try{
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, {type:'array'});
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, {defval:'', raw:false});
          resolve(rows);
        }catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }

  function lookupInternal(barcode){
    if(!barcode) return null;
    return productDB[String(barcode).trim()] || null;
  }

      '<div class="field"><label class="file-label" style="display:inline-block">Escolher planilha<input type="file" accept=".csv,.xlsx,.xls" onchange="App.handleDBFile(event)"></label></div>' +
      '<div id="import-preview"></div>' +

  function handleDBFile(evt){
    var file = evt.target.files && evt.target.files[0];
    if(!file) return;
    var preview = document.getElementById('import-preview');
    preview.innerHTML = '<div class="lookup-status">Lendo planilha…</div>';
    parseSpreadsheetFile(file).then(function(rows){
      var mapped = mapRowsToProducts(rows);
      if(!mapped.count){
        preview.innerHTML = '<div class="warn-box">Não encontramos uma coluna de código de barras nessa planilha. Verifique os nomes das colunas e tente novamente.</div>';
        return;
      }
      pendingImport = mapped.map;
      var sampleKeys = Object.keys(mapped.map).slice(0,5);
      var rowsHtml = sampleKeys.map(function(bc){
        var p = mapped.map[bc];
        return '<tr><td>'+esc(bc)+'</td><td>'+esc(p.codigoInterno||'—')+'</td><td>'+esc(p.descricao||'—')+'</td></tr>';
      }).join('');
      preview.innerHTML =
        '<div class="lookup-status">'+mapped.count+' item(ns) reconhecido(s) ✓ — prévia dos primeiros:</div>' +
        '<table class="import-table"><tr><th>Cód. barras</th><th>Cód. interno</th><th>Descrição</th></tr>' + rowsHtml + '</table>' +
        '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="App.confirmImport()">Importar '+mapped.count+' item(ns)</button>';
    }).catch(function(){
      preview.innerHTML = '<div class="warn-box">Não foi possível ler esse arquivo. Confirme se é um .xlsx ou .csv válido e tente novamente.</div>';
    });
  }

  function confirmImport(){
    if(!pendingImport) return;
    var added = Object.keys(pendingImport).length;
    for(var bc in pendingImport){ productDB[bc] = pendingImport[bc]; }
    var preview = document.getElementById('import-preview');
    if(preview) preview.innerHTML = '<div class="lookup-status">Salvando '+added+' item(ns) na planilha, isso pode levar alguns segundos…</div>';
    persistDB().then(function(){
      pendingImport = null;
      closeModal();
      render();
      alert(added + ' item(ns) importado(s) para a base de produtos.');
    }).catch(function(err){
      if(preview) preview.innerHTML =
        '<div class="warn-box">Não foi possível salvar na planilha agora (' + esc(String((err&&err.message)||err)) + '). Verifique a conexão e tente de novo.</div>' +
        '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="App.confirmImport()">Tentar novamente</button>';
    });
  }

  function clearDB(){
    if(!confirm('Apagar toda a base de produtos importada? Essa ação não afeta os itens já registrados nos módulos.')) return;
    var backup = productDB;
    productDB = {};
    persistDB().then(function(){
      closeModal();
      render();
    }).catch(function(){
      productDB = backup;
      alert('Não foi possível limpar a base na planilha agora. Verifique a conexão e tente novamente.');
    });
  }

  var ROLE_LABEL = { comprador:'Comprador', loja:'Loja', marketing:'Marketing' };

  function normalizedPin(v){ return String(v||'').trim(); }

  function renderGate(){
    var el = document.getElementById('authScreen');
    var needsGate = !SHEETS_API_URL || apiLoading || !apiOk || !currentUser;
    if(!needsGate){
      el.classList.remove('open');
      el.innerHTML = '';
      return false;
    }
    el.classList.add('open');
    if(!SHEETS_API_URL) el.innerHTML = renderConfigScreen();
    else if(apiLoading) el.innerHTML = renderLoadingScreen();
    else if(!apiOk) el.innerHTML = renderErrorScreen();
    else el.innerHTML = users.length ? renderLoginForm() : renderSetupForm();
    return true;
  }

    return '<div class="auth-card">' +
      '<div class="auth-logo"><img src="' + LOGO_SRC + '" alt="Oriundi"></div>' +
      '<div class="auth-title">Configurar conexão</div>' +
      '<div class="auth-sub">Cole a URL do "App da Web" gerada ao publicar o script do Google Apps Script na sua planilha (termina em <span style="font-family:var(--font-mono)">/exec</span>).</div>' +
      (authError ? '<div class="auth-error">'+esc(authError)+'</div>' : '') +

  function submitSetup(){

  function addUser(){
    var nome = document.getElementById('nu-nome').value.trim();
    var papel = document.getElementById('nu-papel').value;
    var pin = normalizedPin(document.getElementById('nu-pin').value);
    if(!nome){ alert('Informe o nome.'); return; }
    if(!/^\d{4}$/.test(pin)){ alert('O PIN deve ter 4 números.'); return; }
    users.push({ id:uid(), nome:nome, papel:papel, pin:pin });
    persistUsers();
    document.getElementById('nu-nome').value = '';
    document.getElementById('nu-pin').value = '';

  function resetUserPin(id){
    var novo = prompt('Novo PIN de 4 dígitos:');
    if(novo === null) return;
    novo = normalizedPin(novo);
    if(!/^\d{4}$/.test(novo)){ alert('O PIN deve ter 4 números.'); return; }
    var u = users.filter(function(x){ return x.id===id; })[0];
    if(!u) return;
    u.pin = novo;
    persistUsers();
    alert('PIN de '+u.nome+' atualizado.');
  }

  function removeUser(id){
    var u = users.filter(function(x){ return x.id===id; })[0];
    if(!u) return;
    var compradores = users.filter(function(x){ return x.papel==='comprador'; });
    if(u.papel==='comprador' && compradores.length <= 1){
      alert('Não é possível remover o único usuário Comprador. Cadastre outro Comprador antes de remover este.');
      return;
    }
    if(!confirm('Remover o acesso de '+u.nome+'?')) return;

  /* ---------- photo compression ---------- */
  function fileToCompressedDataURL(file, maxWidth, quality){
    maxWidth = maxWidth || 360; quality = quality || 0.55;
    var MAX_CHARS = 42000; // margem de segurança abaixo do limite de 50.000 caracteres por célula do Google Sheets
    return new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          function attempt(w0, q0, step){
            var scale = Math.min(1, w0/img.width);
            var w = Math.max(1, Math.round(img.width*scale));
            var h = Math.max(1, Math.round(img.height*scale));
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img,0,0,w,h);
            var dataUrl;
            try{ dataUrl = canvas.toDataURL('image/jpeg', q0); }
            catch(e){ reject(e); return; }
            if(dataUrl.length <= MAX_CHARS || step >= 4){
              resolve(dataUrl);
            } else {
              attempt(Math.round(w0*0.7), Math.max(0.25, q0-0.15), step+1);
            }
          }
          attempt(maxWidth, quality, 0);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

      area.innerHTML = '<div class="lookup-status">Código confere ✓</div>';
    } else {
      area.innerHTML = '<div class="warn-box">O código lido é diferente do item pendente (' + esc(expected) + ').' +
        '<div class="checkbox-row"><input type="checkbox" id="override-check"><label for="override-check">Confirmo que é o mesmo item mesmo assim</label></div></div>';
    }
  }

  /* ---------- shared input handlers ---------- */
  function scanInto(inputId, alsoLookup, context){
    openScanner(function(text){
      var el = document.getElementById(inputId);
      if(el) el.value = text;
      if(alsoLookup){
        if(context==='val'){
          tryLookupInto(text, 'fv-nome', 'photo-row-valnew', 'valNew', 'lookup-area-v', 'fv-codint');
        } else if(context==='placa'){
          tryLookupInto(text, 'fp-nome', 'photo-row-placanew', 'placaNew', 'lookup-area-p', 'fp-codint');
        } else {
          tryLookupInto(text, 'f-nome', 'photo-row-new', 'expoNew', 'lookup-area', 'f-codint');
        }
      }
      if(el){
        var evt = new Event('input', {bubbles:true});
        el.dispatchEvent(evt);
      }
    });
  }

  function tryLookupInto(barcode, nomeFieldId, photoRowId, photoKey, areaId, internoFieldId){
    barcode = (barcode||'').trim();
    if(!barcode) return;
    var area = document.getElementById(areaId);
    var internal = lookupInternal(barcode);
    if(internal){
      if(area) area.innerHTML = '<div class="lookup-status">Item encontrado na base de produtos da loja ✓</div>';
      var nomeFieldI = document.getElementById(nomeFieldId);
      if(nomeFieldI && internal.descricao && !nomeFieldI.value) nomeFieldI.value = internal.descricao;
      if(internoFieldId){
        var intField = document.getElementById(internoFieldId);
        if(intField && internal.codigoInterno) intField.value = internal.codigoInterno;
      }
      if(internal.foto){
        pendingPhoto[photoKey] = internal.foto;
        var rowI = document.getElementById(photoRowId);
        if(rowI) rowI.innerHTML = thumbOrPlaceholder(internal.foto,48) +
          '<label class="file-label">Trocar foto<input type="file" accept="image/*" capture="environment" onchange="App.handlePhoto(event,\''+photoKey+'\',\''+photoRowId+'\')"></label>';
      }
      return;
    }
    if(area) area.innerHTML = '<div class="lookup-status">Buscando produto na base pública…</div>';
    fetchProductInfo(barcode).then(function(info){
      if(!area) return;
      if(!info){
        area.innerHTML = '<div class="lookup-status">Não encontramos esse item automaticamente. Preencha o nome e a foto manualmente.</div>';
        return;
      }
      area.innerHTML = '<div class="lookup-status">Produto encontrado na base pública ✓</div>';
      var nomeField = document.getElementById(nomeFieldId);
      if(nomeField && info.nome && !nomeField.value) nomeField.value = info.nome;
      if(info.foto){
        pendingPhoto[photoKey] = info.foto;
        var row = document.getElementById(photoRowId);
        if(row) row.innerHTML = thumbOrPlaceholder(info.foto,48) +
          '<label class="file-label">Trocar foto<input type="file" accept="image/*" capture="environment" onchange="App.handlePhoto(event,\''+photoKey+'\',\''+photoRowId+'\')"></label>';
      }
    });
  }

  function handlePhoto(evt, key, rowId){
    var file = evt.target.files && evt.target.files[0];
    if(!file) return;
    fileToCompressedDataURL(file).then(function(dataUrl){
      pendingPhoto[key] = dataUrl;
      var row = document.getElementById(rowId);
      if(row) row.innerHTML = thumbOrPlaceholder(dataUrl,48) +
        '<label class="file-label">Trocar foto<input type="file" accept="image/*" capture="environment" onchange="App.handlePhoto(event,\''+key+'\',\''+rowId+'\')"></label>';
    }).catch(function(){ alert('Não foi possível processar essa foto. Tente novamente.'); });
  }

    var el = document.getElementById('dbBar');
    var count = Object.keys(productDB).length;
    if(role !== 'comprador'){
      el.innerHTML = count
        ? '<span class="db-link" style="cursor:default;">Base de produtos: <strong>'+count+'</strong> item(ns) cadastrados</span>'
        : '';
      return;
    }
    el.innerHTML =
      '<button class="db-link" onclick="App.openImportDBModal()">📋 Base de produtos: <strong>'+count+'</strong> item(ns) &middot; importar/atualizar planilha</button>' +
      '<button class="db-link" onclick="App.openUsersModal()">👤 Usuários (' + users.length + ') &middot; gerenciar acessos</button>';
  }

  function renderTabs(){
    var pendCount = itemsExpo.filter(function(i){return i.status==='pendente';}).length;
    var aguardCount = itemsVal.filter(function(i){return i.status==='aguardando';}).length;
    var placaCount;
    if(role === 'marketing') placaCount = itemsPlaca.filter(function(i){return i.status==='pendente';}).length;
    else if(role === 'loja') placaCount = itemsPlaca.filter(function(i){return i.status==='pronta';}).length;
    else placaCount = itemsPlaca.filter(function(i){return i.status==='pendente' || i.status==='pronta';}).length;

    var visible = visibleTabsFor(role);
    var el = document.getElementById('tabs');
    var html = '';
    if(visible.indexOf('expo') !== -1){
      html += '<button class="tab-btn '+(activeTab==='expo'?'active':'')+'" onclick="App.setTab(\'expo\')">Não expostos <span class="tab-count">'+pendCount+'</span></button>';
    }
    if(visible.indexOf('val') !== -1){
      html += '<button class="tab-btn '+(activeTab==='val'?'active':'')+'" onclick="App.setTab(\'val\')">Validade &amp; rebaixa <span class="tab-count">'+aguardCount+'</span></button>';
    }
    if(visible.indexOf('placas') !== -1){
      html += '<button class="tab-btn '+(activeTab==='placas'?'active':'')+'" onclick="App.setTab(\'placas\')">Placas promocionais <span class="tab-count">'+placaCount+'</span></button>';
    }
    el.innerHTML = html;
  }

  function renderNotices(){
    var el = document.getElementById('notices');
    var html = '';
    if(syncError){
      html += '<div class="notice notice-local">⚠ '+esc(syncError)+'</div>';
    }
    if(activeTab==='val'){
      var urgent = itemsVal.filter(function(i){ return i.status==='aguardando' && daysUntil(i.validade) <= 3; });
      if(urgent.length){
        html += '<div class="notice notice-urgent">⚠ ' + urgent.length + ' item(ns) aguardando rebaixa vencem em até 3 dias.</div>';
      }
    }
    el.innerHTML = html;
  }

  function renderMain(){
    var el = document.getElementById('main');
    if(activeTab==='expo') el.innerHTML = renderExpoTab();
    else if(activeTab==='val') el.innerHTML = renderValTab();
    else el.innerHTML = renderPlacaTab();
  }

  var ACCENT_MAP = { 'tag-neutral':'var(--amber)', 'tag-amber':'var(--amber)', 'tag-alert':'var(--red)', 'tag-primary':'var(--green)' };

  function renderExpoTab(){
    var list = itemsExpo.filter(function(i){
      if(expoFilter==='todos') return true;
      return i.status === expoFilter;
    });
    var addBar = role==='comprador'
      ? '<div class="add-bar"><button class="btn btn-primary btn-block" onclick="App.openNewExpoModal()">+ Novo item não exposto</button></div>'
      : '';
    var chips = '<div class="filter-chips">' +
      ['todos','pendente','resolvido'].map(function(f){
        var label = f==='todos'?'Todos':(f==='pendente'?'Pendente':'Resolvido');
        return '<button class="chip '+(expoFilter===f?'active':'')+'" onclick="App.setExpoFilter(\''+f+'\')">'+label+'</button>';
      }).join('') + '</div>';

    var cards = list.length ? ('<div class="card-list">'+list.map(renderExpoCard).join('')+'</div>') : renderEmptyExpo();

    return addBar + '<div class="section-sub">' + chips + '</div>' + cards;
  }

  function renderEmptyExpo(){
    if(role==='loja'){
      return '<div class="empty"><div class="big">Nada pendente por aqui</div>' +
        '<p>Quando o comprador registrar um item que chegou mas não foi exposto, ele aparece nesta lista para a loja confirmar.</p></div>';
    }
    return '<div class="empty"><div class="big">Nenhum item registrado</div>' +
      '<p>Use "Novo item não exposto" para avisar a loja sobre um produto que chegou e ainda não está na seção.</p></div>';
  }

  function renderExpoCard(item){
    var tagClass = item.status==='pendente' ? 'tag-neutral' : 'tag-primary';
    var statusTag = item.status==='pendente'
      ? '<span class="tag tag-neutral">Pendente</span>'
      : '<span class="tag tag-primary">Exposto</span>';
    var actions = '';
    if(role==='loja' && item.status==='pendente'){
      actions = '<div class="card-actions"><button class="btn btn-primary btn-sm" onclick="App.openResolveExpo(\''+item.id+'\')">Confirmar exposição</button></div>';
    }
    if(role==='comprador' && item.status==='pendente'){
      actions = '<div class="card-actions"><button class="btn btn-ghost btn-sm" onclick="App.removeExpo(\''+item.id+'\')">Cancelar</button></div>';
    }
    var meta = '';
    if(item.status==='resolvido'){
      meta = '<div class="card-meta">Exposto em ' + fmtDateTime(item.resolvidoEm) + (item.resolvidoPor?' por '+esc(item.resolvidoPor):'') + '</div>';
      if(item.fotoComprovacao){
        meta += '<div class="proof-row"><img class="proof-thumb" src="'+item.fotoComprovacao+'" alt="Comprovação"></div>';
      }
    } else {
      meta = '<div class="card-meta">Registrado em ' + fmtDateTime(item.criadoEm) + (item.criadoPor?' por '+esc(item.criadoPor):'') + '</div>';
    }
    return '<div class="card" style="--card-accent:'+ACCENT_MAP[tagClass]+'">' +
      '<div class="card-top">' + thumbOrPlaceholder(item.foto,56) +
        '<div class="card-info">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">' +
            '<div><div class="card-name">'+esc(item.nome)+'</div><div class="card-barcode">'+esc(item.barcode)+(item.codigoInterno?' &middot; Interno '+esc(item.codigoInterno):'')+'</div></div>' +
            statusTag +
          '</div>' +
          (item.observacao ? '<div class="card-obs">'+esc(item.observacao)+'</div>' : '') +
        '</div>' +
      '</div>' + meta + actions +
    '</div>';
  }

  function renderValTab(){
    var list = itemsVal.filter(function(i){
      if(valFilter==='todos') return true;
      return i.status === valFilter;
    });
    var addBar = role==='loja'
      ? '<div class="add-bar"><button class="btn btn-amber btn-block" onclick="App.openNewValModal()">+ Reportar item próximo ao vencimento</button></div>'
      : '';
    var chips = '<div class="filter-chips">' +
      ['todos','aguardando','rebaixado'].map(function(f){
        var label = f==='todos'?'Todos':(f==='aguardando'?'Aguardando':'Rebaixado');
        return '<button class="chip '+(valFilter===f?'active':'')+'" onclick="App.setValFilter(\''+f+'\')">'+label+'</button>';
      }).join('') + '</div>';

    var cards = list.length ? ('<div class="card-list">'+list.map(renderValCard).join('')+'</div>') : renderEmptyVal();
    return addBar + '<div class="section-sub">' + chips + '</div>' + cards;
  }

  function renderEmptyVal(){
    if(role==='comprador'){
      return '<div class="empty"><div class="big">Nada aguardando rebaixa</div>' +
        '<p>Quando a loja reportar um item próximo do vencimento, ele aparece aqui para você registrar a rebaixa.</p></div>';
    }
    return '<div class="empty"><div class="big">Nenhum item reportado</div>' +
      '<p>Use "Reportar item próximo ao vencimento" para avisar o comprador sobre um item que precisa de rebaixa.</p></div>';
  }

  function renderValCard(item){
    var dleft = daysUntil(item.validade);
    var tagClass, statusTag;
    if(item.status==='rebaixado'){
      tagClass = 'tag-primary'; statusTag = '<span class="tag tag-primary">Rebaixado</span>';
    } else if(dleft <= 3){
      tagClass = 'tag-alert'; statusTag = '<span class="tag tag-alert">'+(dleft<0?'Vencido':(dleft===0?'Vence hoje':'Vence em '+dleft+'d'))+'</span>';
    } else if(dleft <= 7){
      tagClass = 'tag-amber'; statusTag = '<span class="tag tag-amber">Vence em '+dleft+'d</span>';
    } else {
      tagClass = 'tag-neutral'; statusTag = '<span class="tag tag-neutral">Aguardando</span>';
    }
    var actions = '';
    if(role==='comprador' && item.status==='aguardando'){
      actions = '<div class="card-actions"><button class="btn btn-amber btn-sm" onclick="App.openRebaixaModal(\''+item.id+'\')">Registrar rebaixa</button></div>';
    }
    var meta = '<div class="card-meta">Validade '+fmtDate(item.validade)+' &middot; '+esc(item.quantidade)+' un. aprox. &middot; reportado em '+fmtDateTime(item.reportadoEm)+(item.reportadoPor?' por '+esc(item.reportadoPor):'')+'</div>';
    var obs = '';
    if(item.status==='rebaixado'){
      obs = '<div class="card-obs"><strong>Novo preço: '+fmtMoney(item.novoPreco)+'</strong>' +
        (item.observacaoComprador ? '<br>'+esc(item.observacaoComprador) : '') +
        '<br><span style="color:var(--ink-faint)">Rebaixado em '+fmtDateTime(item.rebaixadoEm)+(item.rebaixadoPor?' por '+esc(item.rebaixadoPor):'')+'</span></div>';
    }
    return '<div class="card" style="--card-accent:'+ACCENT_MAP[tagClass]+'">' +
      '<div class="card-top">' + thumbOrPlaceholder(item.foto,56) +
        '<div class="card-info">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">' +
            '<div><div class="card-name">'+esc(item.nome)+'</div><div class="card-barcode">'+esc(item.barcode)+(item.codigoInterno?' &middot; Interno '+esc(item.codigoInterno):'')+'</div></div>' +
            statusTag +
          '</div>' +
        '</div>' +
      '</div>' + meta + obs + actions +
    '</div>';
  }

  function renderPlacaTab(){
    var list = itemsPlaca.filter(function(i){
      if(placaFilter==='todos') return true;
      return i.status === placaFilter;
    });
    var addBar = role==='comprador'
      ? '<div class="add-bar"><button class="btn btn-green btn-block" onclick="App.openNewPlacaModal()">+ Novo pedido de placa</button></div>'
      : '';
    var chips = '<div class="filter-chips">' +
      ['todos','pendente','pronta','confirmado'].map(function(f){
        var label = f==='todos'?'Todos':(f==='pendente'?'Pendente':(f==='pronta'?'Pronta p/ loja':'Confirmada'));
        return '<button class="chip '+(placaFilter===f?'active':'')+'" onclick="App.setPlacaFilter(\''+f+'\')">'+label+'</button>';
      }).join('') + '</div>';

    var cards = list.length ? ('<div class="card-list">'+list.map(renderPlacaCard).join('')+'</div>') : renderEmptyPlaca();
    return addBar + '<div class="section-sub">' + chips + '</div>' + cards;
  }

  function renderEmptyPlaca(){
    if(role==='marketing'){
      return '<div class="empty"><div class="big">Nenhum pedido de placa</div>' +
        '<p>Pedidos de placa criados pelo comprador — direto ou a partir de uma rebaixa por validade — aparecem aqui para você confirmar que a placa foi feita.</p></div>';
    }
    if(role==='loja'){
      return '<div class="empty"><div class="big">Nenhuma placa para colocar</div>' +
        '<p>Quando o marketing confirmar que uma placa está pronta, ela aparece aqui para você registrar a foto na seção.</p></div>';
    }
    return '<div class="empty"><div class="big">Nenhuma placa solicitada</div>' +
      '<p>Rebaixas por validade geram um pedido de placa automaticamente. Use "Novo pedido de placa" para solicitar outras.</p></div>';
  }

  function renderPlacaCard(item){
    var tagClass, statusLabel;
    if(item.status==='confirmado'){ tagClass='tag-primary'; statusLabel='Confirmada'; }
    else if(item.status==='pronta'){ tagClass='tag-amber'; statusLabel='Pronta — aguarda loja'; }
    else { tagClass='tag-amber'; statusLabel='Aguarda marketing'; }
    var statusTag = '<span class="tag '+tagClass+'">'+statusLabel+'</span>';
    var origemTag = item.origem==='rebaixa' ? ' &middot; gerada por rebaixa' : ' &middot; pedido manual';
    var actions = '';
    if(role==='marketing' && item.status==='pendente'){
      actions = '<div class="card-actions"><button class="btn btn-green btn-sm" onclick="App.confirmPlacaPronta(\''+item.id+'\')">Confirmar placa feita</button></div>';
    }
    if(role==='loja' && item.status==='pronta'){
      actions = '<div class="card-actions"><button class="btn btn-green btn-sm" onclick="App.openLojaPlacaModal(\''+item.id+'\')">Registrar placa na seção</button></div>';
    }
    if(role==='comprador' && item.status==='pendente' && item.origem==='manual'){
      actions = '<div class="card-actions"><button class="btn btn-ghost btn-sm" onclick="App.removePlaca(\''+item.id+'\')">Cancelar</button></div>';
    }
    var meta = '<div class="card-meta">Solicitada em '+fmtDateTime(item.criadoEm)+(item.criadoPor?' por '+esc(item.criadoPor):'')+origemTag+'</div>';
    if(item.status==='pronta' || item.status==='confirmado'){
      meta += '<div class="card-meta">Placa feita em ' + fmtDateTime(item.prontaEm) + (item.prontaPor?' por '+esc(item.prontaPor):'') + '</div>';
    }
    if(item.status==='confirmado'){
      meta += '<div class="card-meta">Registrada na seção em ' + fmtDateTime(item.confirmadoEm) + (item.confirmadoPor?' por '+esc(item.confirmadoPor):'') + '</div>';
      if(item.fotoComprovacao){
        meta += '<div class="proof-row"><img class="proof-thumb" src="'+item.fotoComprovacao+'" alt="Comprovação"></div>';
      }
    }
    return '<div class="card" style="--card-accent:'+ACCENT_MAP[tagClass]+'">' +
      '<div class="card-top">' + thumbOrPlaceholder(item.foto,56) +
        '<div class="card-info">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">' +
            '<div><div class="card-name">'+esc(item.nome)+'</div><div class="card-barcode">'+esc(item.barcode)+(item.codigoInterno?' &middot; Interno '+esc(item.codigoInterno):'')+'</div></div>' +
            statusTag +
          '</div>' +
          '<div class="card-obs"><strong>'+esc(item.infoPlaca)+'</strong>' + (item.observacao ? '<br>'+esc(item.observacao) : '') + '</div>' +
        '</div>' +
      '</div>' + meta + actions +
    '</div>';
  }

  /* ---------- public API for inline handlers ---------- */
  window.App = {
    submitSetup:submitSetup,
    submitLogin:submitLogin,
    logout:logout,
    openUsersModal:openUsersModal,
    addUser:addUser,
    resetUserPin:resetUserPin,
    removeUser:removeUser,
    setTab:function(t){ activeTab = t; render(); },
    setExpoFilter:function(f){ expoFilter = f; render(); },
    setValFilter:function(f){ valFilter = f; render(); },
    setPlacaFilter:function(f){ placaFilter = f; render(); },
    closeModal:closeModal,
    openNewExpoModal:openNewExpoModal,
    submitNewExpo:submitNewExpo,
    removeExpo:removeExpo,
    openResolveExpo:openResolveExpo,
    submitResolveExpo:submitResolveExpo,
    openNewValModal:openNewValModal,
    submitNewVal:submitNewVal,
    openRebaixaModal:openRebaixaModal,
    submitRebaixa:submitRebaixa,
    openNewPlacaModal:openNewPlacaModal,
    submitNewPlaca:submitNewPlaca,
    removePlaca:removePlaca,
    confirmPlacaPronta:confirmPlacaPronta,
    openLojaPlacaModal:openLojaPlacaModal,
    submitLojaPlaca:submitLojaPlaca,
    openImportDBModal:openImportDBModal,
    handleDBFile:handleDBFile,
    confirmImport:confirmImport,
    clearDB:clearDB,
    scanInto:scanInto,
    handlePhoto:handlePhoto,
    submitApiUrl:submitApiUrl,
    retryApi:retryApi,
    changeApiUrl:changeApiUrl
  };

  /* ---------- boot ---------- */
  loadApiUrl();
  if(SHEETS_API_URL){
    apiLoading = true;
    loadAll().then(function(){ apiLoading = false; render(); });
  }
  render();

})();
</script>
</body>
</html>
